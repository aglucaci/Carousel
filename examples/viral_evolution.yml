radar_name: Viral Evolution Radar
description: >
  Tracks viral mutation, immune escape, recombination, host jumps,
  phylodynamics, and genomic surveillance.

sources:
  - pubmed
  - biorxiv
  - medrxiv

queries:
  - "viral evolution"
  - "immune escape"
  - "antigenic drift"
  - "viral recombination"
  - "genomic surveillance"

filters:
  date_range: "last_90_days"
  language: "english"

signal_profile:
  immune_escape:
    description: "Immune evasion and antigenic change"
    terms:
      - immune escape
      - antigenic drift
      - neutralization escape
      - antigenic mapping
    weight: 2.5

  transmission:
    description: "Spread, host range, and outbreak relevance"
    terms:
      - host jump
      - spillover
      - lineage replacement
      - outbreak
    weight: 2.0

  methods:
    description: "Evolutionary and genomic analysis methods"
    terms:
      - phylodynamics
      - phylogenetics
      - molecular clock
      - genomic epidemiology
    weight: 1.8

# Relative priority of the five CAROUSEL signals (rescaled to sum to 1 over
# the signals active in a run). Blueprint starting values, not tuned.
ranking:
  relevance: 0.40
  novelty: 0.20
  momentum: 0.15
  discovery: 0.10
  evidence: 0.15

outputs:
  - dashboard
  - csv
  - bibtex
  - markdown
