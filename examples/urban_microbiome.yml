radar_name: Urban Microbiome Radar
description: >
  Tracks built environment microbiomes, city-scale sampling, transit systems,
  wastewater, urban viromes, and public health surveillance.

sources:
  - pubmed
  - biorxiv
  - medrxiv

queries:
  - "urban microbiome"
  - "built environment microbiome"
  - "transit microbiome"
  - "city-scale metagenomics"
  - "wastewater virome"

filters:
  date_range: "last_90_days"
  language: "english"

signal_profile:
  spatial_sampling:
    description: "Spatial or city-scale study design"
    terms:
      - geospatial
      - city-scale
      - transit system
      - built environment
    weight: 2.0

  pathogen_surveillance:
    description: "Pathogen and public health monitoring"
    terms:
      - pathogen detection
      - genomic surveillance
      - wastewater
      - biosurveillance
    weight: 3.0

  methods:
    description: "Sequencing and analysis methods"
    terms:
      - long-read sequencing
      - metagenomic assembly
      - strain tracking
      - virome
    weight: 2.5

# Relative priority of the five CAROUSEL signals (rescaled to sum to 1 over
# the signals active in a run). Blueprint starting values, not tuned.
ranking:
  relevance: 0.40
  novelty: 0.20
  momentum: 0.15
  discovery: 0.10
  evidence: 0.15

outputs:
  - dashboard
  - csv
  - bibtex
  - markdown
