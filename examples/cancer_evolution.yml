radar_name: Cancer Evolution Radar
description: >
  Tracks cancer evolution, clonal dynamics, therapy resistance, tumor
  phylogenetics, and single-cell methods.

sources:
  - pubmed
  - biorxiv
  - medrxiv

queries:
  - "cancer evolution"
  - "clonal evolution"
  - "tumor phylogeny"
  - "therapy resistance"
  - "subclonal architecture"

filters:
  date_range: "last_90_days"
  language: "english"

signal_profile:
  biological_process:
    description: "Tumor evolution and clonal dynamics"
    terms:
      - clonal selection
      - subclonal expansion
      - tumor evolution
      - lineage tracing
    weight: 2.0

  methods:
    description: "Methods that reveal cancer evolutionary structure"
    terms:
      - single-cell sequencing
      - phylogenetic reconstruction
      - mutational signatures
      - spatial transcriptomics
    weight: 1.5

  clinical_relevance:
    description: "Clinical progression and treatment outcomes"
    terms:
      - relapse
      - minimal residual disease
      - treatment resistance
      - metastasis
    weight: 2.5

# Relative priority of the five CAROUSEL signals (rescaled to sum to 1 over
# the signals active in a run). Blueprint starting values, not tuned.
ranking:
  relevance: 0.40
  novelty: 0.20
  momentum: 0.15
  discovery: 0.10
  evidence: 0.15

outputs:
  - dashboard
  - csv
  - bibtex
  - markdown
