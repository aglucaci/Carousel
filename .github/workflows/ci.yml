name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      # Daily dashboard commits from the radar workflow don't need a test run.
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    services:
      # Disposable Postgres with pgvector for tests/test_postgres.py (Phase 1B schema and imports).
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: carousel
          POSTGRES_PASSWORD: carousel
          POSTGRES_DB: carousel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carousel -d carousel_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CAROUSEL_TEST_DATABASE_URL: postgresql://carousel:carousel@localhost:5432/carousel_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server]"

      - name: Unit tests
        run: python -m pytest -q

      - name: Validate radar configs
        run: |
          radars=(); for f in radars/*.yml; do case "$f" in *.feedback.yml) ;; *) radars+=("$f");; esac; done
          carousel validate examples/*.yml "${radars[@]}"

      - name: Check packaging (built wheel, not the editable install)
        run: |
          set -euo pipefail
          pip wheel . --no-deps -w dist -q
          for f in carousel/core/config.py carousel/site_assets/carousel-logo.svg \
                   carousel/database/migrations/env.py carousel/database/migrations/versions/0001_initial_schema.py; do
            python -m zipfile -l dist/*.whl | grep -q "$f" || { echo "missing from wheel: $f"; exit 1; }
          done
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install -q "$(ls dist/*.whl)[server]"
          cd /tmp && /tmp/wheel-env/bin/carousel --version
          # Migrations run from the installed wheel, not the source tree.
          /tmp/wheel-env/bin/carousel db upgrade --url "${CAROUSEL_TEST_DATABASE_URL}"
          /tmp/wheel-env/bin/carousel db downgrade --url "${CAROUSEL_TEST_DATABASE_URL}"

      - name: Validate CITATION.cff
        if: matrix.python-version == '3.12'
        run: |
          pip install -q cffconvert
          cffconvert --validate

  web:
    # The Next.js app, and the spec's Phase 1 acceptance flow end to end (Playwright):
    # Postgres + Redis services, the API and scan worker replaying recorded HTTP, and the built app.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: carousel
          POSTGRES_PASSWORD: carousel
          POSTGRES_DB: carousel_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carousel -d carousel_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CAROUSEL_E2E_DATABASE_URL: postgresql://carousel:carousel@localhost:5432/carousel_e2e
      CAROUSEL_E2E_REDIS_URL: redis://localhost:6379/15
      CAROUSEL_PYTHON: python
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install the API and worker
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[server]"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install the web app
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Acceptance flow (Playwright)
        run: npm run e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  compose:
    # Task 14: `docker compose up` brings up the whole stack from a fresh clone, and the
    # acceptance flow passes against it (scans replay recorded HTTP; see docker-compose.e2e.yml).
    runs-on: ubuntu-latest
    env:
      COMPOSE: docker compose -p carousel-e2e -f docker-compose.yml -f docker-compose.e2e.yml
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the stack
        run: $COMPOSE up -d --build --wait --wait-timeout 300

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Playwright
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Acceptance flow against the stack
        working-directory: apps/web
        env:
          CAROUSEL_E2E_BASE_URL: http://127.0.0.1:3000
        run: npm run e2e

      - name: Stack logs
        if: failure()
        run: $COMPOSE logs --no-color

      - name: Stop the stack
        if: always()
        run: $COMPOSE down -v
