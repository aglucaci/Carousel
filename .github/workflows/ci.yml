name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      # Daily dashboard commits from the radar workflow don't need a test run.
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Unit tests
        run: python -m pytest -q

      - name: Validate radar configs
        run: carousel validate examples/*.yml

      - name: Check packaging (built wheel, not the editable install)
        run: |
          set -euo pipefail
          pip wheel . --no-deps -w dist -q
          python -m zipfile -l dist/*.whl | grep -q "carousel/core/config.py"
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install -q dist/*.whl
          cd /tmp && /tmp/wheel-env/bin/carousel --version

      - name: Validate CITATION.cff
        if: matrix.python-version == '3.12'
        run: |
          pip install -q cffconvert
          cffconvert --validate
