name: CAROUSEL radar

# Daily: `carousel scan` every radar in radars/*.yml (one matrix job each), then
# publish in one job:
#   1. the GitHub Pages dashboard in docs/ (`carousel site`, committed to main)
#   2. an immutable snapshot of each run on the `snapshots` branch
#   3. each radar's paper store on the `carousel-state` branch (a single commit,
#      force-pushed), so the next scan keeps first-seen times, the history that
#      novelty is measured against, review decisions, and feedback state.
#
# Optional repository secrets: OPENALEX_API_KEY (needed to page past the first
# 100 OpenAlex results; without it GitHub's shared runner IPs share OpenAlex's
# keyless daily budget) and NCBI_API_KEY (faster PubMed).

on:
  workflow_dispatch:
    inputs:
      top:
        description: "Papers recommended per radar"
        required: false
        default: "25"
      max_results:
        description: "Max results per source"
        required: false
        default: "200"
  schedule:
    # ~9am ET (13:00 UTC)
    - cron: "0 13 * * *"

permissions:
  contents: write

concurrency:
  group: carousel-radar
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  SITE_DIR: docs
  STATE_BRANCH: carousel-state
  SNAPSHOT_BRANCH: snapshots

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      radars: ${{ steps.list.outputs.radars }}
    steps:
      - uses: actions/checkout@v4

      - name: List radars
        id: list
        run: |
          set -euo pipefail
          radars=$(for f in radars/*.yml; do case "$f" in *.feedback.yml) ;; *) printf '%s\n' "$f";; esac; done \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "radars=${radars}" >> "$GITHUB_OUTPUT"
          echo "radars: ${radars}"

  scan:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        radar: ${{ fromJSON(needs.plan.outputs.radars) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install CAROUSEL with semantic search (CPU-only PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[semantic]"

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-sentence-transformers-all-MiniLM-L6-v2-v1

      - name: Identify radar
        id: radar
        run: |
          set -euo pipefail
          carousel validate "${{ matrix.radar }}"
          id=$(carousel show "${{ matrix.radar }}" --format json | python -c "import json,sys; print(json.load(sys.stdin)['radar_id'])")
          echo "id=${id}" >> "$GITHUB_OUTPUT"

      - name: Restore paper store
        env:
          RID: ${{ steps.radar.outputs.id }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "${STATE_BRANCH}" >/dev/null; then
            git fetch --depth 1 origin "${STATE_BRANCH}"
            if git cat-file -e "FETCH_HEAD:stores/${RID}.db.gz" 2>/dev/null; then
              git show "FETCH_HEAD:stores/${RID}.db.gz" | gunzip > store.db
              echo "Restored the paper store for ${RID}."
            fi
          fi
          [ -f store.db ] || echo "No stored state for ${RID}; starting a new store."

      - name: Scan
        env:
          RID: ${{ steps.radar.outputs.id }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "out/${RID}"
          carousel scan "${{ matrix.radar }}" --store store.db --embedder semantic \
            --top "${{ inputs.top || '25' }}" --max-results "${{ inputs.max_results || '200' }}" \
            --json "out/${RID}/run.json"
          gzip -9 -c store.db > "out/${RID}/store.db.gz"

      - name: Upload run and store
        uses: actions/upload-artifact@v4
        with:
          name: radar-${{ steps.radar.outputs.id }}
          path: out/${{ steps.radar.outputs.id }}/
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: [plan, scan]
    # Publish whatever scanned successfully; a failed radar keeps its previous page.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install CAROUSEL
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Download scan results
        uses: actions/download-artifact@v4
        with:
          pattern: radar-*
          path: out

      - name: Collect runs
        run: |
          set -euo pipefail
          mkdir -p runs
          for f in radars/*.yml; do
            case "$f" in *.feedback.yml) continue;; esac
            id=$(carousel show "$f" --format json | python -c "import json,sys; print(json.load(sys.stdin)['radar_id'])")
            if [ -s "out/radar-${id}/run.json" ]; then
              cp "out/radar-${id}/run.json" "runs/${id}.json"
            elif [ -s "${SITE_DIR}/radars/${id}/latest.json" ]; then
              echo "::warning::Scan of ${id} failed; republishing its previous run."
              cp "${SITE_DIR}/radars/${id}/latest.json" "runs/${id}.json"
            else
              echo "::warning::Scan of ${id} failed and it has no previous run to show."
            fi
          done
          if ! ls runs/*.json >/dev/null 2>&1; then
            echo "::error::No runs to publish."
            exit 1
          fi

      - name: Build dashboard
        run: |
          set -euo pipefail
          carousel site runs/*.json --out "${SITE_DIR}"
          test -s "${SITE_DIR}/index.html"

      - name: Configure git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

      - name: Write snapshots
        env:
          SNAPSHOT_DIR: ${{ runner.temp }}/snapshots-worktree
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "${SNAPSHOT_BRANCH}" >/dev/null; then
            git fetch origin "${SNAPSHOT_BRANCH}:${SNAPSHOT_BRANCH}"
            git worktree add "${SNAPSHOT_DIR}" "${SNAPSHOT_BRANCH}"
          else
            git worktree add --detach "${SNAPSHOT_DIR}"
            git -C "${SNAPSHOT_DIR}" checkout --orphan "${SNAPSHOT_BRANCH}"
            git -C "${SNAPSHOT_DIR}" rm -rf --quiet .
          fi
          for d in out/radar-*/; do
            id="${d#out/radar-}"; id="${id%/}"
            [ -s "${d}run.json" ] || continue
            python scripts/snapshot.py write --input "${d}run.json" --root "${SNAPSHOT_DIR}" --radar-id "${id}"
          done
          cd "${SNAPSHOT_DIR}"
          git add snapshots
          if git diff --cached --quiet; then
            echo "No new snapshot."
          else
            git commit -m "snapshot $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push origin "HEAD:${SNAPSHOT_BRANCH}"
          fi

      - name: Save paper stores
        env:
          STATE_DIR: ${{ runner.temp }}/state
          GIT_INDEX_FILE: ${{ runner.temp }}/state.index
        run: |
          set -euo pipefail
          mkdir -p "${STATE_DIR}/stores"
          if git ls-remote --exit-code --heads origin "${STATE_BRANCH}" >/dev/null; then
            git fetch --depth 1 origin "${STATE_BRANCH}"
            git archive FETCH_HEAD stores | tar -x -C "${STATE_DIR}"   # keep stores of radars that failed today
          fi
          for d in out/radar-*/; do
            id="${d#out/radar-}"; id="${id%/}"
            [ -s "${d}store.db.gz" ] && cp "${d}store.db.gz" "${STATE_DIR}/stores/${id}.db.gz"
          done
          printf '%s\n' "# CAROUSEL paper stores" "" \
            "One gzipped SQLite store per radar, restored by each scan and replaced after it." \
            "This branch is a single commit, force-pushed by .github/workflows/carousel-radar.yml." \
            "The immutable run history is on the \`snapshots\` branch." > "${STATE_DIR}/README.md"
          # Commit the directory as a parentless commit using a temporary index, so the
          # main checkout is untouched and the branch never accumulates old stores.
          git --git-dir "${GITHUB_WORKSPACE}/.git" --work-tree "${STATE_DIR}" -C "${STATE_DIR}" add -A .
          tree=$(git write-tree)
          commit=$(git commit-tree "${tree}" -m "paper stores $(date -u +'%Y-%m-%dT%H:%M:%SZ')")
          git push --force origin "${commit}:refs/heads/${STATE_BRANCH}"

      - name: Commit dashboard
        run: |
          set -euo pipefail
          git add -A "${SITE_DIR}/"
          if git diff --cached --quiet; then
            echo "No dashboard changes."
            exit 0
          fi
          git commit -m "CAROUSEL radar update $(date -u +'%Y-%m-%d')"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
