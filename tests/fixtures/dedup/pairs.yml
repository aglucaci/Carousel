# Labelled duplicate-detection pairs (plan task 6).
#
# Each pair is two source records that share NO identifier, so the decision
# rests on title / authors / year / kind alone. `expect` is the correct
# decision, `reason` the rule that should fire:
#
#   merge     same work, safe to merge automatically
#   review    plausibly the same work, but a human should decide
#   distinct  different works
#
# Add a pair whenever dedup gets something wrong in real data.

# ------------------------------------------------------------------ merge
