[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name; the import package and CLI are both `carousel`.
name = "carousel-research"
dynamic = ["version"]
description = "Open-source platform for personalized scientific literature discovery and research intelligence."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.6,<3",
  "PyYAML>=6.0",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "fakeredis>=2.20"]
# Real semantic retrieval (sentence-transformers + torch). Without it, CAROUSEL
# falls back to the dependency-free, non-semantic HashingEmbedder.
semantic = ["sentence-transformers>=3"]
# Phase 1B: Postgres + pgvector storage, migrations, and imports.
server = [
  "SQLAlchemy>=2.0", "alembic>=1.13", "psycopg[binary]>=3.1", "pgvector>=0.2.5",
  # Phase 1B API and scan worker
  "fastapi>=0.110", "uvicorn>=0.29", "rq>=1.16", "redis>=5",
]

[project.scripts]
carousel = "carousel.cli:main"

[project.urls]
Homepage = "https://aglucaci.github.io/Carousel/"
Repository = "https://github.com/aglucaci/Carousel"

[tool.setuptools.dynamic]
version = { attr = "carousel.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["carousel*"]

[tool.setuptools.package-data]
carousel = ["site_assets/*", "database/migrations/*.mako", "database/migrations/env.py", "database/migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
