[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name; the import package and CLI are both `carousel`.
name = "carousel-research"
dynamic = ["version"]
description = "Open-source platform for personalized scientific literature discovery and research intelligence."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.6,<3",
  "PyYAML>=6.0",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Real semantic retrieval (sentence-transformers + torch). Without it, CAROUSEL
# falls back to the dependency-free, non-semantic HashingEmbedder.
semantic = ["sentence-transformers>=3"]

[project.scripts]
carousel = "carousel.cli:main"

[project.urls]
Homepage = "https://aglucaci.github.io/Carousel/"
Repository = "https://github.com/aglucaci/Carousel"

[tool.setuptools.dynamic]
version = { attr = "carousel.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["carousel*"]

[tool.setuptools.package-data]
carousel = ["site_assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
